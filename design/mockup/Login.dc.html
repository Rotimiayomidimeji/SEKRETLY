<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sekretly · Log in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./sk.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0;background:#0c0811}
</style>
</helmet>
<div class="sk" data-mode="{{mode}}" style="background: var(--hero); display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 20px">
    <a href="Landing.dc.html" class="logo"><span class="logo-mark">S</span><span class="logo-word">Sekretly</span></a>
    <span style="flex: 1"></span>
    <button class="mode-btn tap" onClick="{{toggleMode}}" aria-label="Switch to {{modeWord}} mode">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2z"></path></svg></sc-if>
      <span>{{modeWord}}</span>
    </button>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px 20px 40px">
    <div class="card rise {{shakeCls}}" style="width: 100%; max-width: 420px; padding: 24px; box-shadow: var(--shadow)">
      <img class="float" src="/_blob/7666419731f56fe89d876dc6bf2dcdb2" alt="" style="width: 64px; height: 64px">
      <h1 style="margin-top: 10px; font-size: 32px; font-weight: 800">Welcome back</h1>
      <p class="muted" style="margin-top: 6px; font-size: 15px">Your secrets missed you.</p>

      <div style="margin-top: 20px">
        <label for="li-user" class="label">Username</label>
        <input id="li-user" class="field" value="{{user}}" onChange="{{onUser}}" autocomplete="username" placeholder="peach">
      </div>
      <div style="margin-top: 14px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <label for="li-pass" class="label">Password</label>
          <a href="Forgot.dc.html" class="pink" style="font-size: 13.5px; font-weight: 700">Forgot password?</a>
        </div>
        <input id="li-pass" class="field" type="password" value="{{pass}}" onChange="{{onPass}}" autocomplete="current-password" placeholder="Your password">
      </div>

      <sc-if value="{{err}}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card2); color: var(--bad); font-size: 14px; font-weight: 700">{{errMsg}}</div>
      </sc-if>

      <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
        <a href="Home.dc.html" class="btn btn-cta btn-lg btn-block tap" style="margin-top: 18px">Log in</a>
      </sc-if>
      <sc-if value="{{notOk}}" hint-placeholder-val="{{ true }}">
        <button class="btn btn-cta btn-lg btn-block tap" onClick="{{attempt}}" disabled="{{locked}}" style="margin-top: 18px">{{btnLabel}}</button>
      </sc-if>
      <p class="muted" style="margin-top: 10px; font-size: 12.5px; text-align: center">Demo: log in as <b>peach</b> / <b>sekret123</b></p>
      <p class="muted" style="margin-top: 16px; text-align: center; font-size: 14px">New here? <a href="Signup.dc.html" class="pink" style="font-weight: 700">Create an account</a></p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var m = null;
    try { m = window.localStorage.getItem('sk-mode'); } catch (e) {}
    this.state = { mode: m || props.mode || 'dark', user: '', pass: '', tries: 0, shake: 0 };
  }
  componentDidMount() {
    var self = this;
    this.onStore = function (e) { if (e.key === 'sk-mode' && e.newValue) self.setState({ mode: e.newValue }); };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() { try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  componentDidUpdate(prev) { if (prev.mode !== this.props.mode && this.props.mode) this.setState({ mode: this.props.mode }); }
  renderVals() {
    var self = this, s = this.state, dark = s.mode !== 'light';
    var correct = s.user.trim().toLowerCase() === 'peach' && s.pass === 'sekret123';
    var locked = s.tries >= 5;
    return {
      mode: dark ? 'dark' : 'light', isDark: dark, isLight: !dark, modeWord: dark ? 'Light' : 'Dark',
      toggleMode: function () { var n = dark ? 'light' : 'dark'; try { window.localStorage.setItem('sk-mode', n); } catch (e) {} self.setState({ mode: n }); },
      user: s.user, pass: s.pass,
      onUser: function (e) { self.setState({ user: e.target.value }); },
      onPass: function (e) { self.setState({ pass: e.target.value }); },
      ok: correct, notOk: !correct,
      err: s.tries > 0 && !correct,
      errMsg: locked ? 'Too many tries. Wait 15 minutes, or reset your password.' : 'That username and password do not match. ' + (5 - s.tries) + ' tries left.',
      locked: locked,
      btnLabel: locked ? 'Locked for 15 minutes' : 'Log in',
      shakeCls: s.shake % 2 ? 'shake' : '',
      attempt: function () { if (!locked) self.setState({ tries: s.tries + 1, shake: s.shake + 1 }); }
    };
  }
}
</script>
</body>
</html>
